name: colorado_catch
description: A multiplatform Flutter app for discovering and tracking Colorado fishing.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  provider: ^6.1.5
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^6.3.0
  cloud_firestore: ^6.8.0
  # firebase_storage and image_picker are currently unused in lib/ — profile
  # photo upload is stubbed out (ProfileScreen) until the project is on the
  # Blaze plan and a Storage bucket exists. See StorageService and SETUP.md.
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  firebase_analytics: ^12.4.6
  google_maps_flutter: ^2.18.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
